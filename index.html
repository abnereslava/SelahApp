<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selah | Gestão de Devocionais</title>

    <meta name="theme-color" content="#2B1E17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Selah">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="loginContainer" class="login-container" style="display: none;">
        <div class="login-card">
            <i class="ph ph-book-bookmark login-logo"></i>
            <h2 class="login-title">Bem-vindo de volta</h2>
            <p class="login-subtitle">Entre na sua conta Selah para continuar</p>
            <button type="button" class="btn-google-login btn-block" id="btnGoogleLogin">
                <svg class="google-logo" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                <span>Entrar com o Google</span>
            </button>
            <div id="loginError" class="login-error text-danger mt-2"
                style="display:none; text-align:center; font-size: 0.9rem;"></div>
        </div>
    </div>

    <div id="dashboardContainer" style="display: none;">
        <div class="dashboard-wrapper">
            <nav class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <button type="button" class="sidebar-toggle-btn" id="btnToggleSidebar" title="Recolher Menu">
                        <i class="ph ph-caret-left"></i>
                    </button>
                    <div class="sidebar-brand">
                        <i class="ph ph-book-bookmark sidebar-logo"></i>
                        <span class="sidebar-title">Selah</span>
                    </div>
                    <button type="button" class="sidebar-close-mobile" id="btnCloseSidebarMobile">
                        <i class="ph ph-x"></i>
                    </button>
                </div>
                <div class="sidebar-nav">
                    <a href="#registros" class="nav-item active">
                        <i class="ph ph-notebook"></i>
                        <span>Registros</span>
                    </a>
                    <a href="#bencaos" class="nav-item">
                        <i class="ph ph-gift"></i>
                        <span>Bênçãos</span>
                    </a>
                    <a href="#oracoes" class="nav-item">
                        <i class="ph ph-hands-praying"></i>
                        <span>Orações</span>
                    </a>
                    <a href="#igreja" class="nav-item">
                        <i class="ph ph-church"></i>
                        <span>Igreja</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-overlay" id="sidebarOverlay"></div>

            <main class="main-content">
                <div class="app-container">

                    <header class="app-header">
                        <div class="header-container">
                            <div class="header-brand-mobile">
                                <button type="button" class="sidebar-toggle-mobile" id="btnToggleMobileSidebar">
                                    <i class="ph ph-list"></i>
                                </button>
                                <div class="brand-wrapper">
                                    <i class="ph ph-book-bookmark"></i>
                                    <span>Selah</span>
                                </div>
                                <img id="userAvatar" class="user-avatar-img" src="" alt="Avatar" referrerpolicy="no-referrer">
                            </div>
                            <div class="header-content">
                                <div class="header-titles">
                                    <h1 id="formTitle">Registro de Leitura</h1>
                                    <p class="header-subtitle">O que o Senhor falou ao seu coração hoje?</p>
                                </div>
                                <div class="header-user">
                                    <span id="userGreeting" style="font-size: 0.875rem; color: var(--text-muted);"></span>
                                    <button type="button" id="btnLogout" class="btn-secondary"
                                        style="padding: 8px 15px; width: auto;"><i class="ph ph-sign-out"></i> Sair</button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div id="spaContent">
                        <!-- Os módulos dinâmicos injetam o conteúdo reativo aqui -->
                    </div>

        <dialog id="customAlertModal" class="modal modal-sm">
            <div class="modal-content text-center">
                <i class="ph ph-info alert-icon-main"></i>
                <p id="customAlertMessage" class="modal-message mt-2"></p>
                <div class="modal-actions mt-4">
                    <button type="button" onclick="this.closest('dialog').close()"
                        class="btn-primary btn-block">Entendido</button>
                </div>
            </div>
        </dialog>

        <dialog id="customConfirmModal" class="modal modal-sm">
            <div class="modal-content text-center">
                <i class="ph ph-warning-circle alert-icon-warning"></i>
                <p id="customConfirmMessage" class="modal-message mt-2"></p>
                <div class="modal-actions mt-4 dual-panel-horizontal">
                    <button type="button" id="btnCancelConfirm" class="btn-secondary">Cancelar</button>
                    <button type="button" id="btnOkConfirm" class="btn-primary">Confirmar</button>
                </div>
            </div>
        </dialog>



    </div>
    </main>
    </div>
        <!-- Bottom Nav para Mobile (visível apenas em telas <= 768px) -->
        <nav class="mobile-bottom-nav" id="mobileBottomNav">
            <a href="#registros" class="nav-item active">
                <i class="ph ph-notebook"></i>
                <span>Registros</span>
            </a>
            <a href="#bencaos" class="nav-item">
                <i class="ph ph-gift"></i>
                <span>Bênçãos</span>
            </a>
            <button type="button" class="nav-fab" id="btnFab" aria-label="Criar novo item">
                <i class="ph ph-plus"></i>
            </button>
            <a href="#oracoes" class="nav-item">
                <i class="ph ph-hands-praying"></i>
                <span>Orações</span>
            </a>
            <a href="#igreja" class="nav-item">
                <i class="ph ph-church"></i>
                <span>Igreja</span>
            </a>
        </nav>

        <!-- FAB Bottom Sheet -->
        <div class="fab-sheet-overlay" id="fabSheetOverlay"></div>
        <div class="fab-sheet" id="fabSheet">
            <div class="fab-sheet-handle"></div>
            <p class="fab-sheet-title">O que deseja registrar?</p>
            <button type="button" class="fab-sheet-option" id="fabOptRegistros" onclick="window.openCreateOverlay('registros')">
                <i class="ph ph-notebook"></i>
                <span>Novo Registro</span>
            </button>
            <button type="button" class="fab-sheet-option" id="fabOptBencaos" onclick="window.openCreateOverlay('bencaos')">
                <i class="ph ph-gift"></i>
                <span>Nova Bênção</span>
            </button>
        </div>

        <!-- Desktop FAB (botão flutuante) -->
        <button type="button" class="desktop-fab" id="btnDesktopFab" aria-label="Criar novo item">
            <i class="ph ph-plus"></i>
        </button>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <div id="mobileQuillToolbar" class="mobile-floating-toolbar" style="display: none;">
        <div id="ftMainGroup" style="display: flex; gap: 6px; align-items: center;">
            <button type="button" data-format="bold"><i class="ph ph-text-b"></i></button>
            <button type="button" data-format="italic"><i class="ph ph-text-italic"></i></button>
            <button type="button" data-format="underline"><i class="ph ph-text-underline"></i></button>
            <button type="button" data-format="header" data-value="1"><i class="ph ph-text-h-one"></i></button>
            <button type="button" data-format="header" data-value="2"><i class="ph ph-text-h-two"></i></button>
            <button type="button" id="ftBtnColorToggle"><i class="ph ph-paint-brush"></i></button>
            <button type="button" data-format="clean"><i class="ph ph-text-strikethrough"></i></button>
        </div>
        <div id="ftColorGroup" style="display: none; gap: 6px; align-items: center;">
            <button type="button" id="ftBtnColorBack"><i class="ph ph-caret-left"></i></button>
            <button type="button" data-format="color" data-value="false" title="Remover Cor" style="color:var(--text-main);"><i class="ph ph-prohibit"></i></button>
            <button type="button" data-format="color" data-value="#e60000"><div style="background-color:#e60000; width:20px; height:20px; border-radius:50%;"></div></button>
            <button type="button" data-format="color" data-value="#ff9900"><div style="background-color:#ff9900; width:20px; height:20px; border-radius:50%;"></div></button>
            <button type="button" data-format="color" data-value="#d4af37"><div style="background-color:#d4af37; width:20px; height:20px; border-radius:50%;"></div></button>
            <button type="button" data-format="color" data-value="#008a00"><div style="background-color:#008a00; width:20px; height:20px; border-radius:50%;"></div></button>
            <button type="button" data-format="color" data-value="#0066cc"><div style="background-color:#0066cc; width:20px; height:20px; border-radius:50%;"></div></button>
            <button type="button" data-format="color" data-value="#9933ff"><div style="background-color:#9933ff; width:20px; height:20px; border-radius:50%;"></div></button>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
