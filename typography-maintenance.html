<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Selah — Manutenção tipográfica</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        main { width: min(760px, 100%); background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 18px; padding: 26px; }
        h1 { margin-top: 0; }
        .actions { display:flex; gap:12px; flex-wrap:wrap; margin:20px 0; }
        button { padding:12px 18px; border-radius:10px; border:1px solid var(--border-color); font-weight:700; cursor:pointer; }
        #analyze { background:var(--secondary-color); color:var(--text-main); }
        #apply { background:var(--primary-color); color:#fff; }
        button:disabled { opacity:.5; cursor:not-allowed; }
        #summary, #log { padding:14px; border-radius:10px; background:rgba(0,0,0,.28); line-height:1.55; }
        #summary { display:none; margin-bottom:12px; }
        #log { min-height:110px; max-height:260px; overflow:auto; white-space:pre-wrap; font:13px/1.5 monospace; }
    </style>
</head>
<body>
    <main>
        <h1>Normalização tipográfica</h1>
        <p id="account">Verificando autenticação…</p>
        <p>Esta página temporária atua somente nos registros da conta autenticada e guarda o conteúdo anterior em cada registro alterado.</p>
        <div class="actions">
            <button id="analyze" disabled>Analisar 675 registros</button>
            <button id="apply" disabled>Aplicar alterações</button>
        </div>
        <div id="summary"></div>
        <div id="log">[Aguardando autenticação.]</div>
    </main>
    <script type="module" src="typography-maintenance.js?v=1"></script>
</body>
</html>
